<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReBrowse Pro</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <h1>ReBrowse Pro</h1>
    <p class="subtitle">AI-Powered Website Theming & Analysis</p>
  </div>

  <div class="main-content">
    <!-- Theme Presets -->
    <div class="card theme-section">
      <div class="card-header">
        <span>🎨 Theme Presets</span>
      </div>
      <div class="button-grid">
        <button id="calm" class="btn" data-theme="calm" title="Soft pastels and serif fonts for relaxed reading">
          <span class="btn-emoji">🌸</span>
          Calm
        </button>
        <button id="focus" class="btn" data-theme="focus" title="Clean layout optimized for reading and concentration">
          <span class="btn-emoji">🎯</span>
          Focus
        </button>
        <button id="funky" class="btn" data-theme="funky" title="Vibrant colors and playful animations">
          <span class="btn-emoji">🌈</span>
          Funky
        </button>
        <button id="hacker" class="btn" data-theme="hacker" title="Terminal-style green on black theme">
          <span class="btn-emoji">💻</span>
          Hacker
        </button>
        <button id="professional" class="btn" data-theme="professional" title="Corporate-friendly design with modern typography">
          <span class="btn-emoji">💼</span>
          Professional
        </button>
        <button id="dark" class="btn" data-theme="dark" title="Easy on the eyes dark theme">
          <span class="btn-emoji">🌙</span>
          Dark Mode
        </button>
        <button id="sepia" class="btn feature-new" data-theme="sepia" title="Warm sepia tones for comfortable reading">
          <span class="btn-emoji">📜</span>
          Sepia
        </button>
        <button id="cyberpunk" class="btn feature-new" data-theme="cyberpunk" title="Neon colors and futuristic styling">
          <span class="btn-emoji">🔮</span>
          Cyberpunk
        </button>
        <button id="reset" class="btn full-width danger">
          <span class="btn-emoji">🔄</span>
          Reset All Styles
        </button>
      </div>
    </div>

    <!-- AI Features -->
    <div class="card ai-section">
      <div class="card-header">
        <span>🤖 AI-Powered Features</span>
      </div>
      <div class="button-grid">
        <button id="autoDetect" class="btn feature-new" title="Let AI analyze the page and suggest the best theme">
          <span class="btn-emoji">🧠</span>
          Auto Detect
        </button>
        <button id="summarize" class="btn" title="Generate a concise summary of the page content">
          <span class="btn-emoji">📝</span>
          Summarize
        </button>
        <button id="highlight" class="btn" title="Extract the most important key points">
          <span class="btn-emoji">✨</span>
          Key Points
        </button>
        <button id="recommend" class="btn" title="Get related topic suggestions">
          <span class="btn-emoji">🔗</span>
          Recommend
        </button>
        <button id="translate" class="btn" title="Translate content to another language">
          <span class="btn-emoji">🌐</span>
          Translate
        </button>
        <button id="accessibility" class="btn" title="Get accessibility improvement suggestions">
          <span class="btn-emoji">♿</span>
          A11y Check
        </button>
      </div>
    </div>

    <!-- Configuration -->
    <div class="card api-section">
      <div class="card-header">
        <span>⚙️ API Configuration</span>
      </div>
      <div class="input-group">
        <div class="input-wrapper">
          <input 
            type="password" 
            id="apiKey" 
            placeholder="Enter your Gemini API Key (AIzaXXX...)"
            autocomplete="off"
            spellcheck="false"
            aria-label="Gemini API Key"
          >
        </div>
        <button id="saveApiKey" class="btn primary" title="Save your API key securely">
          <span class="btn-emoji">💾</span>
          Save
        </button>
      </div>
      
      <div style="margin-top: 16px;">
        <div class="button-grid">
          <button id="testApi" class="btn" title="Test your API connection">
            <span class="btn-emoji">🧪</span>
            Test API
          </button>
          <button id="getApiKey" class="btn secondary" title="Get a free API key from Google AI Studio">
            <span class="btn-emoji">🔑</span>
            Get Key
          </button>
          <button id="clearData" class="btn danger" title="Clear all saved data and preferences">
            <span class="btn-emoji">🗑️</span>
            Clear Data
          </button>
          <button id="viewStats" class="btn" title="View API usage statistics">
            <span class="btn-emoji">📊</span>
            Stats
          </button>
        </div>
      </div>
    </div>

    <!-- Quick Actions -->
    <div class="card">
      <div class="card-header">
        <span>⚡ Quick Actions</span>
      </div>
      <div class="button-grid">
        <button id="darkMode" class="btn" title="Toggle system-wide dark mode filter">
          <span class="btn-emoji">🌓</span>
          Toggle Dark
        </button>
        <button id="readingMode" class="btn" title="Enable distraction-free reading mode">
          <span class="btn-emoji">📖</span>
          Reading Mode
        </button>
        <button id="exportTheme" class="btn" title="Export current theme as JSON file">
          <span class="btn-emoji">💾</span>
          Export Theme
        </button>
        <button id="importTheme" class="btn" title="Import theme from JSON file">
          <span class="btn-emoji">📂</span>
          Import Theme
        </button>
      </div>
      
      <!-- Enhanced Font Size Controls -->
      <div class="font-size-controls">
        <label for="fontSizeSlider" class="font-size-label">
          📏 Font Size: <span id="fontSizeValue">100%</span>
        </label>
        <input 
          type="range" 
          id="fontSizeSlider" 
          min="60" 
          max="250" 
          value="100" 
          step="10"
          aria-label="Font size adjustment"
          title="Adjust font size for better readability"
        >
        <div style="display: flex; gap: 8px; margin-top: 12px;">
          <button id="decreaseFontSize" class="btn" style="flex: 1; font-size: 11px; padding: 8px;" title="Decrease font size">
            <span class="btn-emoji">🔤</span>
            Smaller
          </button>
          <button id="resetFontSize" class="btn" style="flex: 1; font-size: 11px; padding: 8px;" title="Reset to default size">
            Reset
          </button>
          <button id="increaseFontSize" class="btn" style="flex: 1; font-size: 11px; padding: 8px;" title="Increase font size">
            <span class="btn-emoji">🔠</span>
            Larger
          </button>
        </div>
      </div>
    </div>

    <!-- Help Section -->
    <div class="card">
      <div style="text-align: center;">
        <button id="showHelp" class="btn secondary" style="font-size: 12px; padding: 8px 16px;" title="Show detailed help and welcome page">
          <span class="btn-emoji">❓</span>
          Help & Tips
        </button>
      </div>
    </div>

    <!-- Status Display -->
    <div id="status" aria-live="polite" aria-atomic="true"></div>
  </div>

  <!-- Hidden file input for theme import -->
  <input type="file" id="importFileInput" accept=".json" style="display: none;" aria-label="Import theme file">

  <script type="module" src="popup.js"></script>
</body>
</html>

<style>
/* Additional styles for new components */
.shortcuts-info {
  display: flex;
  flex-direction: column;
  gap: 8px;
  font-size: 12px;
}

.shortcut-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 12px;
  background: rgba(255, 255, 255, 0.05);
  border-radius: 6px;
  border: 1px solid var(--border-color);
}

.shortcut-item kbd {
  background: var(--tertiary-bg);
  color: var(--text-secondary);
  padding: 4px 8px;
  border-radius: 4px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  border: 1px solid var(--border-color);
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
}

.font-size-controls {
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid var(--border-color);
}

.font-size-label {
  display: block;
  margin-bottom: 12px;
  font-size: 13px;
  color: var(--text-secondary);
  font-weight: 500;
  text-align: center;
}

/* Enhanced card sections with colored borders */
.card.api-section {
  border-left: 4px solid var(--warning-color);
}

.card.theme-section {
  border-left: 4px solid var(--accent-color);
}

.card.ai-section {
  border-left: 4px solid var(--success-color);
}

/* Improved button layout for 4-button grid */
.button-grid.four-columns {
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

/* Stats modal styles (will be added via JS) */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
  margin-top: 16px;
}

.stat-item {
  text-align: center;
  padding: 12px;
  background: var(--tertiary-bg);
  border-radius: 8px;
  border: 1px solid var(--border-color);
}

.stat-number {
  font-size: 24px;
  font-weight: 700;
  color: var(--accent-color);
  display: block;
  font-family: 'JetBrains Mono', monospace;
}

.stat-label {
  font-size: 12px;
  color: var(--text-secondary);
  margin-top: 4px;
}

/* Accessibility improvements */
@media (prefers-reduced-motion: reduce) {
  * {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* Focus indicators for better keyboard navigation */
button:focus-visible,
input:focus-visible {
  outline: 2px solid var(--accent-color);
  outline-offset: 2px;
}

/* Loading states */
.btn.loading {
  pointer-events: none;
  opacity: 0.7;
}

.btn.loading .btn-emoji {
  animation: spin 1s linear infinite;
}

/* Success/error visual feedback */
.btn.success {
  background: var(--gradient-success) !important;
  color: white !important;
  border-color: transparent !important;
}

.btn.error {
  background: var(--gradient-danger) !important;
  color: white !important;
  border-color: transparent !important;
}
</style>
